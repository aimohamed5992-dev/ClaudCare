<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudCare – UI Design</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0B55B5; --sky:#0A98F5; --orange:#F58A25; --slate:#3F4B5F;
  --blue-50:#EEF5FF; --orange-50:#FFF4EA; --line:#E6EAF0; --muted:#7A8599; --green:#16A34A; --red:#DC2626;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
html,body{background:#fff;color:var(--slate);font-family:'Cairo',system-ui,sans-serif}
body{min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.btn{padding:10px 20px;border-radius:10px;font-weight:700;transition:.15s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{filter:brightness(.95)}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{border:1px solid var(--line);background:#fff}.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.ph{background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:800;overflow:hidden}
img.fill{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- Auth ---------- */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.auth-form{padding:48px 8%;display:flex;flex-direction:column;justify-content:center;gap:20px}
.auth-form img.logo{width:230px}
.auth h1{font-size:30px;color:var(--blue);font-weight:800}
.auth p.sub{color:var(--muted)}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;outline:0}
.field input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(10,152,245,.12)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.row a{color:var(--blue);font-weight:600;text-decoration:none}
.auth-art{position:relative;background:var(--blue-50);margin:20px;border-radius:28px;overflow:hidden;display:grid;place-items:center}
.auth-art .cap{position:absolute;bottom:28px;inset-inline:28px;background:#fff;border-radius:16px;padding:16px 20px;border:1px solid var(--line)}
.auth-art .cap b{color:var(--blue)}
.art-fallback{width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--blue-50) 60%);border:2px dashed var(--sky);display:grid;place-items:center;color:var(--sky);font-weight:700;text-align:center;padding:20px}

/* ---------- Roles ---------- */
.roles{padding:40px 6%}
.roles header{text-align:center;margin-bottom:34px}
.roles header img{width:210px;margin-bottom:10px}
.roles h2{color:var(--blue);font-size:28px}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.role-card{border:1px solid var(--line);border-radius:20px;background:#fff;text-align:start;overflow:hidden;transition:.2s}
.role-card:hover{border-color:var(--orange);transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(11,85,181,.45)}
.role-card .img{height:150px;border-bottom:1px solid var(--line)}
.role-card .body{padding:16px 18px}
.role-card h3{color:var(--blue);font-size:18px}
.role-card p{color:var(--muted);font-size:13px;margin-top:4px}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{border-inline-end:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side img.logo{width:170px;margin:0 auto 18px;display:block}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-weight:600;color:var(--slate);text-align:start;width:100%}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--blue-50)}
.nav.on{background:var(--blue);color:#fff}
.side .spacer{flex:1}
.who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.who .av{width:40px;height:40px;border-radius:50%}
.who small{color:var(--muted);display:block;font-size:12px}
.main{padding:26px 34px 44px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.top h1{font-size:26px;color:var(--blue);flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 14px;width:280px;color:var(--muted)}
.search input{border:0;outline:0;font:inherit;width:100%}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;position:relative}
.icon-btn i{position:absolute;top:8px;inset-inline-end:9px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.banner{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--line);border-radius:20px;padding:22px 28px;margin-bottom:22px;background:linear-gradient(100deg,var(--blue-50),#fff 70%)}
.banner h2{color:var(--blue);font-size:22px}.banner p{color:var(--muted);margin:4px 0 14px}
.banner .art{width:190px;height:120px;border-radius:14px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.stat .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat b{font-size:26px;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat em{font-style:normal;font-size:12px;font-weight:700;float:inline-end}
.up{color:var(--green)}.down{color:var(--red)}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h3{font-size:17px;color:var(--blue);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.card h3 a{font-size:13px;color:var(--orange);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
td{padding:12px 10px;border-bottom:1px solid #F1F3F7}
tr:last-child td{border-bottom:0}
.pp{display:flex;align-items:center;gap:10px;font-weight:600}
.pp .av{width:34px;height:34px;border-radius:50%;flex:none;font-size:13px}
.tag{padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.t-g{background:#E8F7EE;color:var(--green)}.t-o{background:var(--orange-50);color:#C46A10}.t-b{background:var(--blue-50);color:var(--blue)}.t-r{background:#FDECEC;color:var(--red)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.item .dot{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800}
.item b{display:block;font-size:14px}.item small{color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:6px}
.bars div{flex:1;background:var(--blue-50);border-radius:8px 8px 0 0;position:relative}
.bars div.hi{background:var(--blue)}
.bars div span{position:absolute;bottom:-22px;inset-inline:0;text-align:center;font-size:11px;color:var(--muted)}
.empty{display:none;text-align:center;padding:50px 20px}
.empty .art{width:200px;height:150px;margin:0 auto 14px;border-radius:16px}
.switch{position:fixed;bottom:16px;inset-inline-start:16px;z-index:9;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:4px;box-shadow:0 10px 30px -15px rgba(0,0,0,.25)}
.switch button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600}
.switch button.on{background:var(--orange);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:#fff;border-radius:20px;width:min(560px,100%);padding:26px 28px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.modal h2{color:var(--blue)}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots button{border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13px}
.slots button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
@media(max-width:980px){.auth{grid-template-columns:1fr}.auth-art{display:none}.grid9{grid-template-columns:1fr 1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto}.stats{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.banner .art{display:none}}
</style>
</head>

const $=s=>document.querySelector(s);
let state={screen:'auth',role:'doctor',page:0};

function auth(){return `
<div class="auth">
 <div class="auth-form">
  <img class="logo" src="assets/logo.png" alt="ClaudCare">
  <div><h1>تسجيل الدخول</h1><p class="sub">مرحبًا بعودتك، أدخل بياناتك للمتابعة.</p></div>
  <div class="field"><label>البريد الإلكتروني أو رقم الجوال</label><input placeholder="name@hospital.com"></div>
  <div class="field"><label>كلمة المرور</label><input type="password" value="••••••••"></div>
  <div class="row"><label><input type="checkbox" checked> تذكرني</label><a href="#">نسيت كلمة المرور؟</a></div>
  <button class="btn btn-primary" onclick="go('roles')">دخول</button>
 </div>
 <div class="auth-art">
  <div class="art-fallback">ضع الصورة هنا<br>assets/auth/auth-hero.jpg</div>
  <img class="fill" style="position:absolute;inset:0" src="assets/auth/auth-hero.jpg" onerror="this.remove()">
  <div class="cap"><b>رعاية صحية ذكية في مكان واحد</b><br><small style="color:var(--muted)">إدارة المستشفى والفروع والمرضى بسهولة وأمان.</small></div>
 </div>
</div>`}

function roles(){return `
<div class="roles">
 <header><img src="assets/logo.png" alt=""><h2>اختر نوع الحساب</h2><p style="color:var(--muted)">سيتم تخصيص لوحة التحكم حسب دورك.</p></header>
 <div class="grid9">${ROLES.map(r=>`
  <button class="role-card" onclick="openRole('${r.k}')">
   <div class="img">${img('roles/role-'+r.k+'.png','')}</div>
   <div class="body"><h3>${r.n}</h3><p>${r.d}</p></div>
  </button>`).join('')}</div>
</div>`}

function app(){
 const r=ROLES.find(x=>x.k===state.role);
 const tagc=c=>({g:'t-g',o:'t-o',b:'t-b',r:'t-r'}[c]);
 const cell=(c,i)=>Array.isArray(c)?`<span class="tag ${tagc(c[1])}">${c[0]}</span>`:(i===0?`<div class="pp">${av('',c)}${c}</div>`:c);
 const max=Math.max(...r.ch);
 return `
<div class="app">
 <aside class="side">
  <img class="logo" src="assets/logo.png" alt="">
  ${r.nav.map((n,i)=>`<button class="nav ${i===state.page?'on':''}" onclick="setPage(${i})">${ic(n[0])}${n[1]}</button>`).join('')}
  <div class="spacer"></div>
  <div class="who">${av(r.ava,r.user)}<div><b style="font-size:14px">${r.user}</b><small>${r.n}</small></div></div>
  <button class="nav" onclick="go('roles')">${ic('out')}تغيير الحساب</button>
 </aside>
 <main class="main">
  <div class="top"><h1>${r.nav[state.page][1]}</h1>
   <div class="search">${ic('search').replace('<svg','<svg width="18" height="18" stroke="currentColor" fill="none" stroke-width="1.8"')}<input placeholder="بحث..."></div>
   <button class="icon-btn">${ic('bell').replace('<svg','<svg width="20" height="20" stroke="currentColor" fill="none" stroke-width="1.8"')}<i></i></button>
  </div>
  ${state.page>0?inner(r,tagc,cell):`
  <div class="banner"><div><h2>${r.hi}</h2><p>${r.sub}</p><button class="btn btn-primary" onclick="state.modal=1;render()">${r.cta}</button></div>
   <div class="art">${img('roles/role-'+r.k+'.png','')}</div></div>
  <div class="stats">${r.stats.map(s=>`
   <div class="stat"><div class="ic" style="background:var(--${s[4]==='blue'?'blue-50':'orange-50'});color:var(--${s[4]==='blue'?'blue':'orange'})">${ic(s[0])}</div>
   ${s[3]?`<em class="${s[3].startsWith('-')?'down':'up'}">${s[3]}</em>`:''}<b>${s[2]}</b><span>${s[1]}</span></div>`).join('')}</div>
  <div class="cols">
   <div class="card"><h3>${r.tt}<a href="#">عرض الكل</a></h3>
    <table><thead><tr>${r.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${r.rows.map(row=>`<tr>${row.map((c,i)=>`<td>${cell(c,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="card"><h3>${r.st}</h3><div class="list">${r.side.map(s=>`
    <div class="item"><div class="dot ${tagc(s[3])}">${s[2]}</div><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join('')}</div></div>
  </div>
  <div class="card" style="margin-top:18px"><h3>النشاط خلال الأسبوع</h3>
   <div class="bars" style="margin-bottom:24px">${r.ch.map((v,i)=>`<div class="${v===max?'hi':''}" style="height:${v/max*100}%"><span>${r.chart[i]}</span></div>`).join('')}</div></div>`}
 </main>
</div>`}

function inner(r,tagc,cell){
 const title=r.nav[state.page][1];
 const rows=[...r.rows,...r.rows].map((x,i)=>x.map((c,j)=>j===0&&i>=r.rows.length?c+' ٢':c));
 const sel=rows[state.sel||0];
 const viewer=r.k==='radiology'||r.k==='lab';
 const vimg=r.k==='radiology'?'xray-chest.png':'lab-samples.jpg';
 const detail=viewer?`
  <div class="card"><h3>${r.k==='radiology'?'عارض الصور':'نتيجة التحليل'}</h3>
   <div style="aspect-ratio:1;border-radius:14px;background:#0F172A;position:relative;overflow:hidden;display:grid;place-items:center;color:#94A3B8;font-size:13px;text-align:center">
    <img class="fill" style="position:absolute;inset:0" src="assets/medical/${vimg}" onerror="this.remove()">
    <span>${vimg}</span></div>
   <div style="display:flex;gap:8px;margin:12px 0">${['تكبير','تباين','قياس','مقارنة'].map(t=>`<button class="btn btn-ghost" style="flex:1;padding:7px;font-size:12px">${t}</button>`).join('')}</div>
   <div class="field"><label>التقرير</label><input placeholder="اكتب الملاحظات هنا..."></div>
   <button class="btn btn-primary" style="width:100%;margin-top:12px">اعتماد وإرسال</button></div>`:`
  <div class="card"><h3>تفاصيل</h3>
   <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${av('patient-3.jpg',sel[0],'av')}
    <div><b>${sel[0]}</b><small style="display:block;color:var(--muted)">${sel[1]} • ${sel[2]}</small></div></div>
   <div class="list">${[['الحالة',sel[3][0]],['آخر زيارة','12 أكتوبر'],['فصيلة الدم','O+'],['الحساسية','لا يوجد']].map(([a,b])=>`<div class="item"><div><small>${a}</small><b>${b}</b></div></div>`).join('')}</div>
   <button class="btn btn-blue" style="width:100%;margin-top:14px">فتح الملف</button></div>`;
 return `
 <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
  ${['الكل','اليوم','قيد الانتظار','مكتمل'].map((t,i)=>`<button class="btn ${i===0?'btn-blue':'btn-ghost'}" style="padding:7px 16px">${t}</button>`).join('')}
  <span style="flex:1"></span><button class="btn btn-primary" onclick="state.modal=1;render()">+ إضافة جديد</button></div>
 <div class="cols"><div class="card"><h3>${title}</h3>
  <table><thead><tr>${r.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((row,i)=>`<tr onclick="state.sel=${i};render()" style="cursor:pointer;${(state.sel||0)===i?'background:var(--blue-50)':''}">${row.map((c,j)=>`<td>${cell(c,j)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  ${detail}</div>`;
}
function modal(){return `
<div class="modal-bg" onclick="if(event.target===this){state.modal=0;render()}">
 <div class="modal">
  <h2>حجز موعد جديد</h2>
  <div class="field"><label>اسم المريض</label><input placeholder="ابحث أو أدخل الاسم"></div>
  <div class="two">
   <div class="field"><label>القسم</label><select><option>الباطنة</option><option>القلب</option><option>الأطفال</option><option>العظام</option></select></div>
   <div class="field"><label>الطبيب</label><select><option>د. منى القاسم</option><option>د. فهد عمر</option></select></div>
  </div>
  <div class="field"><label>التاريخ</label><input type="date"></div>
  <div class="field"><label>الوقت المتاح</label><div class="slots">${['09:00','09:30','10:00','10:30','11:00','11:30'].map((t,i)=>`<button class="${i===3?'on':''}">${t}</button>`).join('')}</div></div>
  <div class="field"><label>ملاحظات</label><input placeholder="سبب الزيارة"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
   <button class="btn btn-ghost" onclick="state.modal=0;render()">إلغاء</button>
   <button class="btn btn-primary" onclick="state.modal=0;render()">تأكيد الحجز</button></div>
 </div></div>`}
function render(){
 $('#root').innerHTML=(state.screen==='auth'?auth():state.screen==='roles'?roles():app())+(state.modal?modal():'');
 $('#switch').innerHTML=[['auth','الدخول'],['roles','الأدوار']].map(([k,t])=>`<button class="${state.screen===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')+
  ROLES.map(r=>`<button class="${state.screen==='app'&&state.role===r.k?'on':''}" onclick="openRole('${r.k}')">${r.n}</button>`).join('');
 window.scrollTo(0,0);
}
function go(s){state.screen=s;state.modal=0;render()}
function openRole(k){state={screen:'app',role:k,page:0,sel:0};render()}
function setPage(i){state.page=i;state.sel=0;render()}
render();
</script>
</body>
</html>
