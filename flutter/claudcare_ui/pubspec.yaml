name: claudcare_ui
description: مكتبة واجهات ClaudCare المشتركة بين تطبيق الطبيب وتطبيق المريض (ألوان، سمة، مكونات).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
